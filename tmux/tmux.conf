#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 10000

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Claude Code recommendations: pass escape sequences through, and extended keys (Shift+Enter)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Heavy pane borders for the cockpit look
set -g pane-border-lines heavy

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Status line customisation
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g status-left " #{session_name}  "
set-option -g status-right "#{pane_title} "
set-option -g status-style "fg=#7C7D83 bg=#242631"
set-option -g window-status-format "#{window_index}:#{pane_current_command}#{window_flags} "
set-option -g window-status-current-format "#{window_index}:#{pane_current_command}#{window_flags} "
set-option -g window-status-current-style "fg=#E9E9EA"
set-option -g window-status-activity-style none

#--------------------------------------------------------------------------
# Claude cockpit
#--------------------------------------------------------------------------

set -g @cockpit_amber "#e0a040"
set -g @cockpit_amber_dim "#7a5a28"
set -g @cockpit_blue "#7aa2d8"
set -g @cockpit_dim "#5c5e66"

%hidden CC_SHELL='#{m/r:^-?(zsh|fish|bash|sh)$,#{pane_current_command}}'
%hidden CC_LIVE="#{&&:#{@claude_state},#{!:$CC_SHELL}}"
%hidden CC_WAITING="#{&&:#{==:#{@claude_state},waiting},#{!:$CC_SHELL}}"
%hidden CC_DONE="#{&&:#{==:#{@claude_state},done},#{!:$CC_SHELL}}"
%hidden CC_GLYPH="#{?$CC_WAITING,◆,#{?$CC_DONE,✓,#{?#{==:#{@claude_state},working},●,#{?#{==:#{@claude_state},agents},◐,○}}}}"
%hidden CC_TEXT="#{?$CC_WAITING,needs you,#{?#{==:#{@claude_state},agents},agents working,#{@claude_state}}}"
%hidden CC_COLOUR="#{?#{&&:#{@claude_attn},$CC_WAITING},#{?@claude_glow,#{@claude_glow},#{@cockpit_amber}},#{?#{&&:#{@claude_attn},$CC_DONE},#{@cockpit_blue},#{?$CC_WAITING,#{@cockpit_amber},#{@cockpit_dim}}}}"
%hidden CC_MARKS="#{P:#{?#{&&:#{@claude_attn},$CC_WAITING},#[fg=#{@cockpit_amber}]◆#[default],}#{?#{&&:#{@claude_attn},$CC_DONE},#[fg=#{@cockpit_blue}]✓#[default],}}"
%hidden CC_GLOW="#{?#{&&:#{@claude_attn},$CC_WAITING},#{?@claude_glow,#{@claude_glow},#{@cockpit_amber}},#{?#{&&:#{@claude_attn},$CC_DONE},#{@cockpit_blue},}}"
set -g pane-border-style "#{?$CC_GLOW,fg=$CC_GLOW,default}"
set -g pane-active-border-style "#{?$CC_GLOW,fg=$CC_GLOW,#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}}"

set -g pane-border-status top
set -g pane-border-format "#{?$CC_LIVE,#[fg=$CC_COLOUR] $CC_GLYPH #{@claude_label} · $CC_TEXT #[default],#[fg=#{@cockpit_dim}] #{pane_current_command} · #{b:pane_current_path} #[default]}"

set-option -g window-status-format "${CC_MARKS}#{window_index}:#{pane_current_command}#{window_flags} "
set-option -g window-status-current-format "${CC_MARKS}#{window_index}:#{pane_current_command}#{window_flags} "
set-option -g status-right "#{S:#{W:${CC_MARKS}}} #{pane_title} "

set-hook -g pane-focus-in 'run-shell -b "~/.local/bin/claude-tmux-hook focus-in #{hook_pane}"'
set-hook -g pane-focus-out 'run-shell -b "~/.local/bin/claude-tmux-hook focus-out #{hook_pane} \"#{client_flags}\""'

#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window

# Move the current window to the next window or previous window position
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind Space last-window

# Switch between two most recently used sessions
bind ^ switch-client -l

# use PREFIX+| (or PREFIX+\) to split window horizontally and PREFIX+- or
# (PREFIX+_) to split vertically also use the current pane path to define the
# new pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

# Setup 'v' to begin selection as in Vim
if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' \
    'bind-key -T copy-mode-vi v send-keys -X begin-selection;'

bind y run -b "tmux show-buffer | pbcopy"\; display-message "Copied tmux buffer to system clipboard"

bind-key -r F new-window t

# Open Neovim in a new window at the current pane's folder
bind e new-window -n nvim -c "#{pane_current_path}" nvim

# Claude cockpit: pick any agent (waiting first), or jump to the newest one that needs you
bind a display-popup -E -w 80% -h 50% "~/.local/bin/claude-tmux-jump pick"
bind u run-shell -b "~/.local/bin/claude-tmux-jump next"
