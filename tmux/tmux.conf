setw -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename on
set -g renumber-windows on
set -g mouse on
set -g set-titles on
setw -g monitor-activity on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -s escape-time 0

set -g default-terminal "tmux-256color"
if-shell '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "${TERM}"'
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard:sync:extkeys"
set -s extended-keys on
set -s set-clipboard on
set -g allow-passthrough all

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind C-p previous-window
bind C-n next-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

is_vim="#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"

bind -r n next-window
bind -r p previous-window
bind -r N swap-window -d -t +1
bind -r P swap-window -d -t -1
bind Space last-window
bind ^ switch-client -l

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind y run-shell -b "tmux save-buffer - | tmux load-buffer -w -" \; display-message "Copied tmux buffer to system clipboard"

bind e new-window -n nvim -c "#{pane_current_path}" nvim
bind F display-popup -E -w 80% -h 50% -T "#{E:@riso_popup} worktrees " "~/.local/bin/t"
bind a display-popup -E -w 80% -h 50% -T "#{E:@riso_popup} agents " "~/.local/bin/claude-tmux-jump pick"
bind u run-shell -b "~/.local/bin/claude-tmux-jump next"

set -g pane-border-lines single
set -g pane-border-status off
set -g status-position bottom
set -g status-interval 0

source-file -q ~/.config/tmux/colors.conf

%hidden CC_SHELL='#{m/r:^-?(zsh|fish|bash|sh)$,#{pane_current_command}}'
%hidden CC_LIVE="#{&&:#{@claude_state},#{!:$CC_SHELL}}"
%hidden CC_WAITING="#{&&:#{==:#{@claude_state},waiting},#{!:$CC_SHELL}}"
%hidden CC_DONE="#{&&:#{==:#{@claude_state},done},#{!:$CC_SHELL}}"
%hidden CC_NEED="#{&&:#{@claude_attn},$CC_WAITING}"
%hidden CC_NEWS="#{&&:#{@claude_attn},$CC_DONE}"
%hidden CC_GLYPH="#{?$CC_WAITING,◆,#{?$CC_DONE,✓,#{?#{==:#{@claude_state},working},●,#{?#{==:#{@claude_state},agents},◐,○}}}}"
%hidden CC_TEXT="#{?$CC_WAITING,needs you,#{?#{==:#{@claude_state},agents},agents working,#{@claude_state}}}"
%hidden CC_INK="#{?$CC_WAITING,#{@c_yellow},#{?$CC_NEWS,#{@c_green},#{@c_on_surface_variant}}}"
%hidden CC_ON_INK="#{?$CC_WAITING,#{@c_on_yellow},#{@c_on_green}}"
%hidden CC_TEXT_INK="#{?#{||:$CC_WAITING,$CC_NEWS},$CC_INK,#{@c_outline}}"
%hidden CC_GLOW="#{?$CC_NEED,#{?@claude_glow,#{@claude_glow},#{@c_yellow}},#{?$CC_NEWS,#{@c_green},}}"
%hidden CC_CHIP="#[fg=$CC_ON_INK#,bg=$CC_INK#,bold] $CC_GLYPH #{@claude_label} #[fg=#{@c_tertiary}#,bg=default#,nobold]▌"
%hidden CC_PLAIN="#[fg=$CC_INK] $CC_GLYPH #{@claude_label}"

set -g pane-border-style "fg=#{?$CC_GLOW,$CC_GLOW,#{@c_outline_variant}}"
set -g pane-active-border-style "fg=#{?$CC_GLOW,$CC_GLOW,#{@c_primary}}"
set -g pane-border-format "#{?$CC_LIVE,#{?#{||:$CC_NEED,$CC_NEWS},$CC_CHIP,$CC_PLAIN}#[fg=$CC_TEXT_INK#,bg=default#,nobold] $CC_TEXT #[default],}"

set -g @cc_need "#{P:#{?$CC_NEED,1,}}"
set -g @cc_news "#{P:#{?$CC_NEWS,1,}}"
set -g @riso_agents "#{S:#{W:#{P:#{?$CC_NEED,#[fg=#{@c_yellow}]◆,}#{?$CC_NEWS,#[fg=#{@c_green}]✓,}}}}"
set -g @riso_popup "#[fg=#{@c_on_primary},bg=#{@c_primary},bold]"

set -g @riso_win "#[range=window|#{window_index}]#[fg=#{@c_on_surface_variant}]    #I #W#{?window_activity_flag,#[fg=#{@c_tertiary}#,bold] •#[nobold],}#{?window_bell_flag,#[fg=#{@c_error}#,bold] !#[nobold],}#{?#{E:@cc_need},#[fg=#{@c_yellow}#,bold] ◆#[nobold],}#{?#{E:@cc_news},#[fg=#{@c_green}#,bold] ✓#[nobold],} #[norange]"
set -g @riso_win_on "#[range=window|#{window_index}]#[fg=#{@c_tertiary}] \uF04B #[fg=#{@c_on_primary_container},bg=#{@c_primary_container},bold] #I #W #[fg=#{@c_tertiary},bg=#{@c_bar},nobold]▌ #[norange]"
set -g @riso_left "#[fg=#{@c_on_primary},bg=#{@c_primary},bold] #S #[fg=#{@c_tertiary},bg=#{@c_bar},nobold]▌ #{W:#{E:@riso_win},#{E:@riso_win_on}}"
set -g @riso_pips "#[fg=#{@c_tertiary}]#{R:\uF0C8,#{window_panes}}#[fg=#{@c_outline_variant}]#{?#{e|<:#{window_panes},4},#{R:\uF096,#{e|-:4,#{window_panes}}},} "
set -g @lamp "#[fg=#1a7a1a]\U0010EEEE̅̅\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE#[default] "
set -g status-format[0] "#{?@fx_left,#{@fx_left},#{E:@riso_left}}#[align=right]#{E:@riso_agents} #{E:@riso_pips}#{@lamp}"

set-hook -g session-window-changed "run-shell -b \"python3 -I ~/.config/tmux/fx.py switch '#{session_id}'\""
set-hook -g client-attached "run-shell -b \"python3 -I ~/.config/tmux/fx.py attach '#{session_id}'\""
set-hook -g alert-bell "run-shell -b \"python3 -I ~/.config/tmux/fx.py bell '#{session_id}' '#{window_index}'\""
set-hook -g pane-focus-in "run-shell -b \"~/.local/bin/claude-tmux-hook focus-in '#{hook_pane}'\""
set-hook -g pane-focus-out "run-shell -b \"~/.local/bin/claude-tmux-hook focus-out '#{hook_pane}' '#{client_flags}'\""
