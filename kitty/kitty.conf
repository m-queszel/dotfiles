# BEGIN_KITTY_FONTS
font_family      family="0xProto Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
#
font_size       16
adjust_line_height 135%

cursor_blink_interval 0
enable_audio_bell 0
window_padding_width 10
# --- Background: image (commented) vs blank/neutral (active) ---
# To use the image background, uncomment the three lines below and
# comment out the `background` line further down.
background_image /Users/josephmartin/Pictures/carInSunset.png
background_image_layout scaled
background_tint 0.8

# Blank / neutral background (comment this out when using the image above)
# background #1e1e1e


# BEGIN_KITTY_THEME
# duckbones
include current-theme.conf
# END_KITTY_THEME
